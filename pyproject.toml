[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backend-switchboard"
dynamic = ["version"]
description = "Switch Claude Code between your Anthropic subscription, Argo, MAG and ALCF models with /model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "Neil Getty" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Proxy Servers",
]
keywords = ["claude-code", "proxy", "router", "argo", "alcf", "llm-gateway", "anthropic"]

[project.optional-dependencies]
# Only needed for @alcf (translates the Anthropic API to OpenAI chat). Requires Python 3.10+.
alcf = ["llm-rosetta==0.7.3; python_version >= '3.10'"]

[project.urls]
Homepage = "https://github.com/n-getty/backend-switchboard"
Repository = "https://github.com/n-getty/backend-switchboard"
Issues = "https://github.com/n-getty/backend-switchboard/issues"

[project.scripts]
backend-switchboard = "backend_switchboard._router:main"

[tool.hatch.version]
path = "backend_switchboard/__init__.py"
